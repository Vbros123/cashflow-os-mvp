services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cashflow_os
      POSTGRES_USER: cashflow
      POSTGRES_PASSWORD: cashflow_dev_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashflow -d cashflow_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
